# Monthly live trading performance email — 1st of each month ~09:30 IST (04:00 UTC).
# Covers the previous calendar month from LIVE order history.
#
# Required: GitHub secret CRON_SECRET (match Vercel)
# Optional: variable APP_URL

name: Monthly live performance email

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in GitHub Actions secrets."
            exit 1
          fi

      - name: Call Vercel monthly live performance cron API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          BASE="${APP_URL:-https://algo-trader-umber.vercel.app}"
          URL="${BASE}/api/cron/monthly-live-performance"
          SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "GET ${URL}"

          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/cron-body.json \
            -H "Authorization: Bearer ${SECRET}" \
            "${URL}")
          echo "HTTP ${HTTP}"
          cat /tmp/cron-body.json | head -c 2000 || true
          echo ""

          if [ "$HTTP" != "200" ]; then
            echo "::error::Cron API returned HTTP ${HTTP}"
            exit 1
          fi

          {
            echo "## Monthly live performance cron OK"
            echo ""
            echo '```json'
            head -c 1500 /tmp/cron-body.json
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
