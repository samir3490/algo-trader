# On-demand paper performance snapshot (last N days, FIFO realized).
# Required: GitHub secret CRON_SECRET (match Vercel)

name: Paper performance snapshot

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback days (IST)"
        required: false
        default: "30"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in GitHub Actions secrets."
            exit 1
          fi

      - name: Call paper performance cron API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          BASE="${APP_URL:-https://algo-trader-umber.vercel.app}"
          URL="${BASE}/api/cron/paper-performance?days=${DAYS}"
          SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "GET ${URL}"

          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/paper-perf.json \
            -H "Authorization: Bearer ${SECRET}" \
            "${URL}")
          echo "HTTP ${HTTP}"
          cat /tmp/paper-perf.json
          echo ""

          if [ "$HTTP" != "200" ]; then
            echo "::error::Paper performance API returned HTTP ${HTTP}"
            exit 1
          fi

          {
            echo "## Paper performance"
            echo ""
            echo '```json'
            cat /tmp/paper-perf.json
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
