# Runs strategy scans every 15 minutes during NSE hours (weekdays).
# Works on Vercel Hobby — unlike Vercel Cron, which is limited to once per day on Hobby.
#
# Required setup (one time):
#   GitHub → repo → Settings → Secrets and variables → Actions
#   Secret name: CRON_SECRET  (same value as CRON_SECRET on Vercel)
#   Optional variable: APP_URL = https://algo-trader-umber.vercel.app
#
# See docs/SERVER-STRATEGY-CRON.md

name: Strategy scan (15 min)

on:
  schedule:
    # UTC: ~09:00–15:45 IST (market 09:15–15:30); adjust if needed
    - cron: "*/15 4-10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = place trades (market hours); lastScan = dump saved diagnostics"
        required: false
        default: "run"
        type: choice
        options:
          - run
          - lastScan

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in GitHub Actions secrets."
            echo ""
            echo "Fix:"
            echo "  1. Vercel → algo-trader → Settings → Environment Variables → copy CRON_SECRET"
            echo "     (or create one: openssl rand -base64 32, add to Vercel AND GitHub)"
            echo "  2. GitHub → samir3490/algo-trader → Settings → Secrets and variables → Actions"
            echo "  3. New repository secret → Name: CRON_SECRET → paste the same value"
            echo "  4. Re-run this workflow (Actions → Strategy scan → Run workflow)"
            echo ""
            echo "Docs: docs/SERVER-STRATEGY-CRON.md"
            {
              echo "## Strategy cron failed — missing secret"
              echo ""
              echo "Add repository secret **\`CRON_SECRET\`** (must match Vercel)."
              echo ""
              echo "See [SERVER-STRATEGY-CRON.md](https://github.com/samir3490/algo-trader/blob/master/docs/SERVER-STRATEGY-CRON.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Call Vercel strategy cron API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          BASE="${APP_URL:-https://algo-trader-umber.vercel.app}"
          # lastScan=1 returns saved scan diagnostics without placing trades (works after hours)
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "lastScan" ]; then
            URL="${BASE}/api/cron/strategies?lastScan=1"
          else
            URL="${BASE}/api/cron/strategies"
          fi
          # Trim accidental newlines/spaces from GitHub secret paste
          SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "GET ${URL}"

          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/cron-body.json \
            -H "Authorization: Bearer ${SECRET}" \
            "${URL}")
          echo "HTTP ${HTTP}"
          # Compact diagnostics first (survives log truncation); then a short raw preview
          if command -v jq >/dev/null 2>&1; then
            jq -c '{ok,ranAt,totalTrades,results:[.results[]?|{userId,tradesExecuted,diagnostics:(.diagnostics|{paperBalance,openPositions,maxPositions,paperSignals,liveSignals,buyDecisions,sellDecisions})}],lastScans:[.lastScans[]?|{userId,lastCronAt,ranAt:.lastScanSummary.ranAt,signals:.lastScanSummary.signalsFound,trades:.lastScanSummary.tradesExecuted,diagnostics:(.lastScanSummary.diagnostics|{buySignals,sellSignals,buyDecisions,sellDecisions,paperSignals,liveSignals,openPositions,maxPositions,slotsToFill,paperBalance,skipReasons})}]}' \
              /tmp/cron-body.json || true
          fi
          cat /tmp/cron-body.json | head -c 8000 || true
          echo ""

          if [ "$HTTP" = "503" ]; then
            echo "::error::Vercel has no CRON_SECRET at runtime. Add it for Production and Redeploy."
            exit 1
          fi
          if [ "$HTTP" = "401" ]; then
            echo "::error::Unauthorized (401). GitHub CRON_SECRET does not match Vercel, or Vercel was not redeployed after adding the variable."
            exit 1
          fi
          if [ "$HTTP" != "200" ]; then
            echo "::error::Cron API returned HTTP ${HTTP}"
            exit 1
          fi

          {
            echo "## Strategy cron OK"
            echo ""
            echo '```json'
            head -c 1500 /tmp/cron-body.json
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
